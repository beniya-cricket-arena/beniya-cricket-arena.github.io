<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beniya Cricket Arena — Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07110d;
      color: #ffffff;
    }

    header {
      background: #10251b;
      padding: 18px 20px;
      border-bottom: 1px solid #2e5c45;
    }

    header h1 {
      margin: 0;
      color: #ffffff;
      font-size: 24px;
    }

    header p {
      margin: 6px 0 0;
      color: #a9c5b5;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: #10251b;
      border: 1px solid #284b3a;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
    }

    h2 {
      margin-top: 0;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 10px;
      border-radius: 8px;
      border: 1px solid #466654;
      font-size: 15px;
    }

    input,
    select {
      background: #07110d;
      color: white;
    }

    button {
      border: none;
      background: #35d07f;
      color: #06120b;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .danger {
      background: #ef6262;
      color: white;
    }

    .secondary {
      background: #345545;
      color: white;
    }

    .hidden {
      display: none;
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
      background: #1b3829;
      white-space: pre-wrap;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat {
      background: #10251b;
      border: 1px solid #284b3a;
      border-radius: 12px;
      padding: 18px;
    }

    .stat strong {
      display: block;
      font-size: 28px;
      color: #35d07f;
    }

    .booking {
      background: #0a1811;
      border: 1px solid #284b3a;
      padding: 15px;
      border-radius: 10px;
      margin-top: 12px;
    }

    .booking p {
      margin: 5px 0;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .top-actions button {
      width: auto;
      min-width: 130px;
    }

    @media (max-width: 600px) {
      .actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🏏 Beniya Cricket Arena</h1>
  <p>Private Admin Dashboard</p>
</header>

<div class="container">

  <!-- LOGIN -->
  <div id="loginCard" class="card">
    <h2>Admin Login</h2>

    <label>Admin Password</label>
    <input
      type="password"
      id="password"
      placeholder="Enter admin password"
    >

    <button onclick="login()">Login</button>

    <div id="loginMessage"></div>
  </div>


  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">

    <div class="card">
      <div class="top-actions">
        <button onclick="loadBookings()">Refresh Bookings</button>

        <button
          class="secondary"
          onclick="loadSettings()"
        >
          Refresh Settings
        </button>

        <button
          class="danger"
          onclick="logout()"
        >
          Logout
        </button>
      </div>
    </div>


    <!-- STATISTICS -->
    <div class="stats">

      <div class="stat">
        <strong id="totalBookings">0</strong>
        Total Bookings
      </div>

      <div class="stat">
        <strong id="pendingBookings">0</strong>
        Pending
      </div>

      <div class="stat">
        <strong id="confirmedBookings">0</strong>
        Confirmed
      </div>

    </div>


    <!-- SETTINGS -->
    <div class="card">

      <h2>Arena Settings</h2>

      <label>Arena Name</label>
      <input id="arenaName">

      <label>Opening Time</label>
      <input
        id="openingTime"
        placeholder="5:00 AM"
      >

      <label>Closing Time</label>
      <input
        id="closingTime"
        placeholder="2:00 PM"
      >

      <label>Price Per Hour</label>
      <input
        id="pricePerHour"
        type="number"
      >

      <label>UPI ID</label>
      <input id="upiId">

      <label>Contact Number</label>
      <input id="contactNumber">

      <button onclick="saveSettings()">
        Save Settings
      </button>

      <div id="settingsMessage"></div>

    </div>


    <!-- BLOCK SLOT -->
    <div class="card">

      <h2>Block a Time Slot</h2>

      <label>Date</label>
      <input
        type="date"
        id="blockDate"
      >

      <label>Slot Index</label>
      <input
        type="number"
        id="slotIndex"
        min="0"
        placeholder="Example: 0"
      >

      <label>Reason</label>
      <input
        id="blockReason"
        placeholder="Maintenance / Private event"
      >

      <button onclick="blockSlot()">
        Block Slot
      </button>

      <div id="blockMessage"></div>

    </div>


    <!-- BOOKINGS -->
    <div class="card">

      <h2>Bookings</h2>

      <div id="bookings">
        Loading...
      </div>

    </div>

  </div>

</div>


<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbxsanXjRk3npiLNaUKLjdTpgWUSw47bBo5HK3wNQ8wQFS5GAT6b50Wh72cTIcKzhq8p3g/exec";

let adminToken =
  sessionStorage.getItem("beniyaAdminToken") || "";


/* ==============================
   API REQUEST
================================ */

async function api(action, extra = {}) {

  const response = await fetch(
    API_URL,
    {
      method: "POST",

      body: JSON.stringify({
        action: action,
        token: adminToken,
        ...extra
      })
    }
  );

  const text = await response.text();

  try {
    return JSON.parse(text);
  }
  catch (error) {
    throw new Error(
      "Invalid response from server: " + text
    );
  }

}


/* ==============================
   LOGIN
================================ */

async function login() {

  const password =
    document
      .getElementById("password")
      .value;

  const message =
    document
      .getElementById("loginMessage");

  message.className = "message";
  message.textContent = "Logging in...";

  try {

    const result =
      await api(
        "adminlogin",
        {
          password: password
        }
      );

    if (!result.success) {

      message.textContent =
        result.message ||
        "Login failed.";

      return;
    }

    adminToken = result.token;

    sessionStorage.setItem(
      "beniyaAdminToken",
      adminToken
    );

    showDashboard();

  }
  catch (error) {

    message.textContent =
      error.message;

  }

}


/* ==============================
   SHOW DASHBOARD
================================ */

function showDashboard() {

  document
    .getElementById("loginCard")
    .classList
    .add("hidden");

  document
    .getElementById("dashboard")
    .classList
    .remove("hidden");

  loadBookings();
  loadSettings();

}


/* ==============================
   LOGOUT
================================ */

function logout() {

  adminToken = "";

  sessionStorage.removeItem(
    "beniyaAdminToken"
  );

  location.reload();

}


/* ==============================
   LOAD BOOKINGS
================================ */

async function loadBookings() {

  const container =
    document
      .getElementById("bookings");

  container.textContent =
    "Loading bookings...";

  try {

    const result =
      await api(
        "adminlistbookings"
      );

    if (!result.success) {

      if (
        String(result.message || "")
          .toLowerCase()
          .includes("unauthorized")
      ) {
        logout();
        return;
      }

      container.textContent =
        result.message ||
        "Could not load bookings.";

      return;

    }

    const bookings =
      result.bookings || [];

    renderBookings(bookings);

  }
  catch (error) {

    container.textContent =
      error.message;

  }

}


/* ==============================
   RENDER BOOKINGS
================================ */

function renderBookings(bookings) {

  const container =
    document
      .getElementById("bookings");

  document
    .getElementById("totalBookings")
    .textContent =
      bookings.length;

  const pending =
    bookings.filter(
      booking =>
        String(
          booking.status || ""
        ).toUpperCase() ===
        "PENDING"
    ).length;

  const confirmed =
    bookings.filter(
      booking =>
        String(
          booking.status || ""
        ).toUpperCase() ===
        "CONFIRMED"
    ).length;

  document
    .getElementById("pendingBookings")
    .textContent =
      pending;

  document
    .getElementById("confirmedBookings")
    .textContent =
      confirmed;


  if (!bookings.length) {

    container.innerHTML =
      "<p>No bookings found.</p>";

    return;

  }


  container.innerHTML =
    bookings.map(
      booking => {

        const bookingId =
          booking.bookingId ||
          booking.id ||
          "";

        return `
          <div class="booking">

            <p>
              <strong>Booking ID:</strong>
              ${escapeHtml(bookingId)}
            </p>

            <p>
              <strong>Customer:</strong>
              ${escapeHtml(
                booking.customerName ||
                booking.name ||
                ""
              )}
            </p>

            <p>
              <strong>Phone:</strong>
              ${escapeHtml(
                booking.phone || ""
              )}
            </p>

            <p>
              <strong>Date:</strong>
              ${escapeHtml(
                booking.date || ""
              )}
            </p>

            <p>
              <strong>Slot:</strong>
              ${escapeHtml(
                booking.slot ||
                booking.slotLabel ||
                booking.slotIndex ||
                ""
              )}
            </p>

            <p>
              <strong>Payment Reference:</strong>
              ${escapeHtml(
                booking.paymentReference ||
                ""
              )}
            </p>

            <p>
              <strong>Status:</strong>
              ${escapeHtml(
                booking.status || ""
              )}
            </p>

            <div class="actions">

              <button
                onclick="confirmBooking(
                  '${escapeJs(bookingId)}'
                )"
              >
                Confirm
              </button>

              <button
                class="danger"
                onclick="rejectBooking(
                  '${escapeJs(bookingId)}'
                )"
              >
                Reject
              </button>

            </div>

          </div>
        `;

      }
    ).join("");

}


/* ==============================
   CONFIRM BOOKING
================================ */

async function confirmBooking(
  bookingId
) {

  if (
    !confirm(
      "Confirm booking " +
      bookingId +
      "?"
    )
  ) {
    return;
  }

  try {

    const result =
      await api(
        "adminconfirmbooking",
        {
          bookingId: bookingId
        }
      );

    alert(
      result.message ||
      (
        result.success
          ? "Booking confirmed."
          : "Could not confirm booking."
      )
    );

    if (result.success) {
      loadBookings();
    }

  }
  catch (error) {

    alert(error.message);

  }

}


/* ==============================
   REJECT BOOKING
================================ */

async function rejectBooking(
  bookingId
) {

  if (
    !confirm(
      "Reject/cancel booking " +
      bookingId +
      "?"
    )
  ) {
    return;
  }

  try {

    const result =
      await api(
        "adminrejectbooking",
        {
          bookingId: bookingId
        }
      );

    alert(
      result.message ||
      (
        result.success
          ? "Booking rejected."
          : "Could not reject booking."
      )
    );

    if (result.success) {
      loadBookings();
    }

  }
  catch (error) {

    alert(error.message);

  }

}


/* ==============================
   LOAD SETTINGS
================================ */

async function loadSettings() {

  try {

    const result =
      await api(
        "admingetsettings"
      );

    if (!result.success) {
      return;
    }

    const settings =
      result.settings || {};

    document
      .getElementById("arenaName")
      .value =
        settings.arenaName ||
        settings.turfName ||
        "";

    document
      .getElementById("openingTime")
      .value =
        settings.openingTime || "";

    document
      .getElementById("closingTime")
      .value =
        settings.closingTime || "";

    document
      .getElementById("pricePerHour")
      .value =
        settings.pricePerHour || "";

    document
      .getElementById("upiId")
      .value =
        settings.upiId || "";

    document
      .getElementById("contactNumber")
      .value =
        settings.contactNumber || "";

  }
  catch (error) {

    console.error(error);

  }

}


/* ==============================
   SAVE SETTINGS
================================ */

async function saveSettings() {

  const message =
    document
      .getElementById(
        "settingsMessage"
      );

  message.className = "message";
  message.textContent =
    "Saving...";


  const settings = {

    arenaName:
      document
        .getElementById("arenaName")
        .value,

    openingTime:
      document
        .getElementById("openingTime")
        .value,

    closingTime:
      document
        .getElementById("closingTime")
        .value,

    pricePerHour:
      document
        .getElementById("pricePerHour")
        .value,

    upiId:
      document
        .getElementById("upiId")
        .value,

    contactNumber:
      document
        .getElementById("contactNumber")
        .value

  };


  try {

    const result =
      await api(
        "adminsavesettings",
        {
          settings: settings
        }
      );

    message.textContent =
      result.message ||
      (
        result.success
          ? "Settings saved."
          : "Could not save settings."
      );

  }
  catch (error) {

    message.textContent =
      error.message;

  }

}


/* ==============================
   BLOCK SLOT
================================ */

async function blockSlot() {

  const message =
    document
      .getElementById(
        "blockMessage"
      );

  const date =
    document
      .getElementById(
        "blockDate"
      )
      .value;

  const slotIndex =
    Number(
      document
        .getElementById(
          "slotIndex"
        )
        .value
    );

  const reason =
    document
      .getElementById(
        "blockReason"
      )
      .value;


  if (!date) {

    message.className =
      "message";

    message.textContent =
      "Please select a date.";

    return;

  }


  try {

    message.className =
      "message";

    message.textContent =
      "Blocking slot...";


    const result =
      await api(
        "adminblockslot",
        {
          date: date,
          slotIndex: slotIndex,
          reason: reason
        }
      );


    message.textContent =
      result.message ||
      (
        result.success
          ? "Slot blocked."
          : "Could not block slot."
      );

  }
  catch (error) {

    message.textContent =
      error.message;

  }

}


/* ==============================
   SAFETY HELPERS
================================ */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function escapeJs(value) {

  return String(value)
    .replaceAll("\\", "\\\\")
    .replaceAll("'", "\\'");

}


/* ==============================
   START
================================ */

if (adminToken) {
  showDashboard();
}

</script>

</body>
</html>
